[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openhands-discovery"
version = "0.5.0"
description = "Backend discovery and read aggregation for an OpenHands deployment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.143.3",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[project.scripts]
openhands-discovery = "openhands_discovery.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
# This repository waits seven days after a PyPI upload before it resolves a
# version. The lock keeps that cutoff, so a fresh release cannot enter it.
exclude-newer = "7 days"